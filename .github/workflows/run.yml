name: Fine-Tuning Preparation

on:
  push:
    branches:
      - feature/finetuning

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  prepare-finetuning:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify original dataset
        run: |
          if [ ! -f "sentiment_dataset_enriched.csv" ]; then
            echo "ERROR: sentiment_dataset_enriched.csv was not found."
            exit 1
          fi

          echo "Original dataset found successfully."
          ls -lh sentiment_dataset_enriched.csv

      - name: Create frozen dataset splits
        run: |
          python make_splits_and_balance_table.py

      - name: Verify generated dataset files
        run: |
          echo "Files inside the data folder:"
          ls -lh data

          echo ""
          echo "Class-balance table:"
          cat data/class_balance_table.csv

          test -f data/train.csv
          test -f data/validation.csv
          test -f data/test_frozen.csv
          test -f data/class_balance_table.csv

          echo ""
          echo "All four dataset files were generated successfully."

     
      - name: Load model and tokenize samples
        run: |
          mkdir -p finetune
          python load_and_tokenize_check.py 2>&1 | tee finetune/load_and_tokenize.log

      - name: Verify fine-tuning documentation
        run: |
          test -f finetune/load_and_tokenize.log

          echo "Fine-tuning notes and loading log found."
          echo ""
          echo "Log contents:"
          cat finetune/load_and_tokenize.log

      - name: Upload fine-tuning deliverables
        uses: actions/upload-artifact@v4
        with:
          name: finetuning-preparation-deliverables
          path: |
            finetune/load_and_tokenize.log
            data/train.csv
            data/validation.csv
            data/test_frozen.csv
            data/class_balance_table.csv
          if-no-files-found: error
          retention-days: 30
