name: Fine-Tuning Training and Evaluation

on:
  push:
    branches:
      - feature/finetuning
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-distilbert:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dataset splits
        run: python make_splits_and_balance_table.py

      - name: Load model and tokenize
        run: |
          mkdir -p finetune
          python load_and_tokenize_check.py > finetune/load_and_tokenize.log

      - name: Fine-tune DistilBERT
        run: |
          python finetune/train_distilbert.py > finetune/training.log

      - name: Evaluate model
        run: |
          python finetune/evaluate_finetuned.py > finetune/evaluation.log

      - name: Compare all models
        run: |
          python finetune/final_comparison.py > finetune/final_comparison.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finetuning-complete-deliverables
          path: |
            finetune/
            data/
