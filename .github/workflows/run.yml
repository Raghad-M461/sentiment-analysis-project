name: Fine-Tuning Training and Evaluation

on:
  push:
    branches:
      - feature/finetuning
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-distilbert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dataset splits
        run: python make_splits_and_balance_table.py

      - name: Fine-tune DistilBERT
        run: python finetune/train_distilbert.py

      - name: Evaluate model
        run: python finetune/evaluate_finetuned.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finetuning-results
          path: |
            finetune/best_checkpoint/
            finetune/classification_report.txt
            finetune/confusion_matrix.png
            finetune/evaluation_results.json
            finetune/results.md
            finetune/epoch_metrics.json
